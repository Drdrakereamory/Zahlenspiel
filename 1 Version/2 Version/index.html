<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zahlenraten 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #13131a;
      --accent: #f0e040;
      --accent2: #ff4d6d;
      --accent3: #4dffb4;
      --text: #f0f0f0;
      --muted: #555570;
      --border: #2a2a3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: 72px;
      letter-spacing: 4px;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 40px rgba(240, 224, 64, 0.3);
    }
    .header p {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* DIFFICULTY */
    .difficulty-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px;
    }
    .diff-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .diff-btn.active {
      background: var(--accent);
      color: var(--bg);
    }
    .diff-btn:hover:not(.active) {
      color: var(--text);
      background: var(--border);
    }

    /* STATS BAR */
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 8px;
    }
    .stat {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: 'Bebas Neue', cursive;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
    }
    .stat-value.danger { color: var(--accent2); }
    .stat-value.success { color: var(--accent3); }

    /* GAME CARD */
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    }

    /* MODE LABEL */
    .mode-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mode-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .mode-icon { font-size: 16px; }

    /* INPUT MODE */
    #mode-input { display: block; }
    #mode-choice { display: none; }
    #mode-wheel { display: none; }

    .big-input {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 4px;
      color: var(--accent);
      font-family: 'Bebas Neue', cursive;
      font-size: 80px;
      text-align: center;
      padding: 20px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .big-input::-webkit-outer-spin-button,
    .big-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .big-input:focus { border-color: var(--accent); }
    .big-input.shake {
      animation: shake 0.4s ease;
      border-color: var(--accent2) !important;
    }
    .big-input.correct {
      border-color: var(--accent3) !important;
    }

    .hint-text {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* CHOICE MODE */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .choice-btn {
      padding: 28px 20px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Bebas Neue', cursive;
      font-size: 48px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .choice-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.02); }
    .choice-btn.wrong { border-color: var(--accent2); color: var(--accent2); animation: shake 0.4s ease; }
    .choice-btn.correct-choice { border-color: var(--accent3); color: var(--accent3); }

    /* WHEEL MODE */
    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .wheel-display {
      width: 200px;
      height: 200px;
      border: 3px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    .wheel-number {
      font-family: 'Bebas Neue', cursive;
      font-size: 80px;
      color: var(--accent);
      position: relative;
      z-index: 2;
    }
    .wheel-spinning .wheel-number {
      animation: wheelSpin 2s ease-out;
    }
    .wheel-ring {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .spin-btn {
      padding: 16px 40px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-family: 'Bebas Neue', cursive;
      font-size: 24px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .spin-btn:hover { transform: scale(1.05); background: #ffe000; }
    .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .wheel-result-text {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* FEEDBACK */
    .feedback {
      margin-top: 20px;
      min-height: 40px;
      text-align: center;
    }
    .feedback-text {
      font-family: 'Bebas Neue', cursive;
      font-size: 32px;
      letter-spacing: 2px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
    }
    .feedback-text.show {
      opacity: 1;
      transform: translateY(0);
    }
    .feedback-text.low { color: var(--accent2); }
    .feedback-text.high { color: #4d9fff; }
    .feedback-text.win { color: var(--accent3); }
    .feedback-text.lose { color: var(--accent2); }

    /* TIMER BAR */
    .timer-bar-container {
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      height: 6px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: var(--accent3);
      transition: width 1s linear, background 0.5s;
      width: 100%;
    }
    .timer-bar.warning { background: var(--accent); }
    .timer-bar.danger { background: var(--accent2); }

    /* GAME OVER / WIN OVERLAY */
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10,10,15,0.95);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 32px;
    }
    .overlay.show { display: flex; }
    .overlay-emoji { font-size: 64px; }
    .overlay-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 52px;
      letter-spacing: 4px;
    }
    .overlay-title.win { color: var(--accent3); }
    .overlay-title.lose { color: var(--accent2); }
    .overlay-sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      line-height: 1.8;
    }
    .restart-btn {
      margin-top: 8px;
      padding: 16px 48px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-family: 'Bebas Neue', cursive;
      font-size: 24px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .restart-btn:hover { transform: scale(1.05); }

    /* ANIMATIONS */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    @keyframes wheelSpin {
      0% { transform: scale(0.5) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(10deg); opacity: 1; }
      80% { transform: scale(0.95) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-card { animation: fadeInUp 0.4s ease; }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>ZAHLEN&shy;RATEN</h1>
    <p>Errate die geheime Zahl</p>
  </div>

  <!-- DIFFICULTY -->
  <div class="difficulty-bar">
    <button class="diff-btn active" onclick="setDifficulty('leicht')">Leicht<br><span style="font-weight:400;color:inherit;opacity:0.6">1–20</span></button>
    <button class="diff-btn" onclick="setDifficulty('mittel')">Mittel<br><span style="font-weight:400;color:inherit;opacity:0.6">1–100</span></button>
    <button class="diff-btn" onclick="setDifficulty('schwer')">Schwer<br><span style="font-weight:400;color:inherit;opacity:0.6">1–500</span></button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Versuche</div>
      <div class="stat-value" id="stat-versuche">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Max</div>
      <div class="stat-value" id="stat-max">10</div>
    </div>
    <div class="stat">
      <div class="stat-label">Timer</div>
      <div class="stat-value" id="stat-timer">30</div>
    </div>
    <div class="stat">
      <div class="stat-label">Gewonnen</div>
      <div class="stat-value success" id="stat-wins">0</div>
    </div>
  </div>

  <!-- GAME CARD -->
  <div class="game-card" id="game-card">

    <!-- OVERLAY -->
    <div class="overlay" id="overlay">
      <div class="overlay-emoji" id="overlay-emoji">🎉</div>
      <div class="overlay-title" id="overlay-title">GEWONNEN!</div>
      <div class="overlay-sub" id="overlay-sub"></div>
      <button class="restart-btn" onclick="neuesSpiel()">NOCHMAL SPIELEN</button>
    </div>

    <!-- MODE LABEL -->
    <div class="mode-label">
      <span class="mode-icon" id="mode-icon">🔢</span>
      <span id="mode-name">Zahl eingeben</span>
    </div>

    <!-- MODE: INPUT -->
    <div id="mode-input">
      <input 
        type="number" 
        class="big-input" 
        id="zahlen-input" 
        placeholder="?"
        onkeydown="if(event.key==='Enter') raten()"
        autofocus
      >
      <div class="hint-text">↵ Enter zum Raten</div>
    </div>

    <!-- MODE: MULTIPLE CHOICE -->
    <div id="mode-choice">
      <div class="choices-grid" id="choices-grid"></div>
    </div>

    <!-- MODE: WHEEL -->
    <div id="mode-wheel">
      <div class="wheel-container">
        <div class="wheel-display" id="wheel-display">
          <div class="wheel-ring"></div>
          <div class="wheel-number" id="wheel-number">?</div>
        </div>
        <div class="wheel-result-text" id="wheel-result-text">Dreh das Rad!</div>
        <button class="spin-btn" id="spin-btn" onclick="spinWheel()">DREHEN 🎰</button>
      </div>
    </div>

    <!-- FEEDBACK -->
    <div class="feedback">
      <div class="feedback-text" id="feedback"></div>
    </div>

    <!-- TIMER BAR -->
    <div class="timer-bar-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

  </div>
</div>

<script>
  // =====================
  //  SPIELZUSTAND
  // =====================
  let geheimeZahl = 0;
  let versuche = 0;
  let maxVersuche = 10;
  let spielVorbei = false;
  let timerSekunden = 30;
  let timerInterval = null;
  let gesamtWins = 0;
  let schwierigkeit = 'leicht';
  let maxZahl = 20;
  let aktuelleModus = 'input'; // 'input', 'choice', 'wheel'
  let wheelGezogen = false;
  let wheelZahl = null;

  const modi = ['input', 'choice', 'wheel'];
  const modiNamen = {
    input: { name: 'Zahl eingeben', icon: '🔢' },
    choice: { name: 'Multiple Choice', icon: '🎯' },
    wheel: { name: 'Glücksrad', icon: '🎰' }
  };

  // =====================
  //  SCHWIERIGKEIT
  // =====================
  function setDifficulty(level) {
    schwierigkeit = level;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    event.target.closest('.diff-btn').classList.add('active');

    if (level === 'leicht') { maxZahl = 20; maxVersuche = 10; timerSekunden = 30; }
    else if (level === 'mittel') { maxZahl = 100; maxVersuche = 10; timerSekunden = 30; }
    else { maxZahl = 500; maxVersuche = 12; timerSekunden = 45; }

    document.getElementById('stat-max').textContent = maxVersuche;
    neuesSpiel();
  }

  // =====================
  //  NEUES SPIEL
  // =====================
  function neuesSpiel() {
    geheimeZahl = Math.floor(Math.random() * maxZahl) + 1;
    versuche = 0;
    spielVorbei = false;
    wheelGezogen = false;
    wheelZahl = null;

    document.getElementById('stat-versuche').textContent = '0';
    document.getElementById('stat-max').textContent = maxVersuche;
    document.getElementById('overlay').classList.remove('show');

    // Zufälligen Modus wählen
    aktuelleModus = modi[Math.floor(Math.random() * modi.length)];
    zeigeMode(aktuelleModus);

    // Feedback leeren
    zeigeNachricht('', '');

    // Timer starten
    starteTimer();
  }

  // =====================
  //  MODUS ANZEIGEN
  // =====================
  function zeigeMode(modus) {
    document.getElementById('mode-input').style.display = 'none';
    document.getElementById('mode-choice').style.display = 'none';
    document.getElementById('mode-wheel').style.display = 'none';

    document.getElementById('mode-icon').textContent = modiNamen[modus].icon;
    document.getElementById('mode-name').textContent = modiNamen[modus].name;

    if (modus === 'input') {
      document.getElementById('mode-input').style.display = 'block';
      document.getElementById('zahlen-input').value = '';
      document.getElementById('zahlen-input').focus();

    } else if (modus === 'choice') {
      document.getElementById('mode-choice').style.display = 'block';
      generiereChoices();

    } else if (modus === 'wheel') {
      document.getElementById('mode-wheel').style.display = 'block';
      document.getElementById('wheel-number').textContent = '?';
      document.getElementById('wheel-result-text').textContent = 'Dreh das Rad!';
      document.getElementById('spin-btn').disabled = false;
    }
  }

  // =====================
  //  MULTIPLE CHOICE
  // =====================
  function generiereChoices() {
    const richtige = geheimeZahl;
    const optionen = new Set([richtige]);

    while (optionen.size < 4) {
      let fake = Math.floor(Math.random() * maxZahl) + 1;
      optionen.add(fake);
    }

    // Mischen
    const shuffled = [...optionen].sort(() => Math.random() - 0.5);
    const grid = document.getElementById('choices-grid');
    grid.innerHTML = '';

    shuffled.forEach(zahl => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = zahl;
      btn.onclick = () => choiceRaten(zahl, btn);
      grid.appendChild(btn);
    });
  }

  function choiceRaten(zahl, btn) {
    if (spielVorbei) return;

    versuche++;
    document.getElementById('stat-versuche').textContent = versuche;

    if (zahl === geheimeZahl) {
      btn.classList.add('correct-choice');
      gewonnen();
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      zeigeNachricht(zahl < geheimeZahl ? '📉 Zu niedrig!' : '📈 Zu hoch!', zahl < geheimeZahl ? 'low' : 'high');
      setTimeout(() => btn.classList.remove('wrong'), 400);

      if (versuche >= maxVersuche) verloren();
    }
  }

  // =====================
  //  GLÜCKSRAD
  // =====================
  function spinWheel() {
    if (spielVorbei) return;
    const btn = document.getElementById('spin-btn');
    const display = document.getElementById('wheel-display');
    const numEl = document.getElementById('wheel-number');
    const resultText = document.getElementById('wheel-result-text');

    btn.disabled = true;
    resultText.textContent = 'Dreht sich...';

    // Zufallszahl generieren
    wheelZahl = Math.floor(Math.random() * maxZahl) + 1;
    wheelGezogen = true;

    // Spin-Animation: schnell wechselnde Zahlen
    let ticks = 0;
    const maxTicks = 20;
    const interval = setInterval(() => {
      numEl.textContent = Math.floor(Math.random() * maxZahl) + 1;
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(interval);
        // Finale Zahl zeigen
        display.classList.add('wheel-spinning');
        numEl.textContent = wheelZahl;
        resultText.textContent = 'Das Rad hat gesprochen!';

        setTimeout(() => {
          display.classList.remove('wheel-spinning');
          // Automatisch raten
          versuche++;
          document.getElementById('stat-versuche').textContent = versuche;

          if (wheelZahl === geheimeZahl) {
            gewonnen();
          } else {
            zeigeNachricht(wheelZahl < geheimeZahl ? '📉 Zu niedrig!' : '📈 Zu hoch!', wheelZahl < geheimeZahl ? 'low' : 'high');
            if (versuche < maxVersuche) {
              setTimeout(() => {
                btn.disabled = false;
                resultText.textContent = 'Nochmal drehen!';
                numEl.textContent = '?';
              }, 1500);
            } else {
              verloren();
            }
          }
        }, 300);
      }
    }, 80);
  }

  // =====================
  //  EINGABE RATEN
  // =====================
  function raten() {
    if (spielVorbei || aktuelleModus !== 'input') return;

    const input = document.getElementById('zahlen-input');
    const tipp = Number(input.value);

    if (!tipp || tipp < 1 || tipp > maxZahl) {
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 400);
      return;
    }

    versuche++;
    document.getElementById('stat-versuche').textContent = versuche;
    input.value = '';

    if (tipp < geheimeZahl) {
      zeigeNachricht('📉 ZU NIEDRIG!', 'low');
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 400);
    } else if (tipp > geheimeZahl) {
      zeigeNachricht('📈 ZU HOCH!', 'high');
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 400);
    } else {
      input.classList.add('correct');
      gewonnen();
      return;
    }

    if (versuche >= maxVersuche) verloren();
    else input.focus();
  }

  // =====================
  //  GEWONNEN / VERLOREN
  // =====================
  function gewonnen() {
    spielVorbei = true;
    stoppeTimer();
    gesamtWins++;
    document.getElementById('stat-wins').textContent = gesamtWins;

    document.getElementById('overlay-emoji').textContent = '🎉';
    document.getElementById('overlay-title').textContent = 'GEWONNEN!';
    document.getElementById('overlay-title').className = 'overlay-title win';
    document.getElementById('overlay-sub').innerHTML = 
      `Die Zahl war <strong style="color:#4dffb4">${geheimeZahl}</strong><br>
       Du hast <strong style="color:#f0e040">${versuche} Versuch${versuche === 1 ? '' : 'e'}</strong> gebraucht.<br>
       Modus: ${modiNamen[aktuelleModus].icon} ${modiNamen[aktuelleModus].name}`;

    setTimeout(() => document.getElementById('overlay').classList.add('show'), 600);
  }

  function verloren() {
    spielVorbei = true;
    stoppeTimer();

    document.getElementById('overlay-emoji').textContent = '💀';
    document.getElementById('overlay-title').textContent = 'GAME OVER';
    document.getElementById('overlay-title').className = 'overlay-title lose';
    document.getElementById('overlay-sub').innerHTML = 
      `Die Zahl war <strong style="color:#ff4d6d">${geheimeZahl}</strong><br>
       Du hast alle ${maxVersuche} Versuche verbraucht.`;

    setTimeout(() => document.getElementById('overlay').classList.add('show'), 300);
  }

  // =====================
  //  FEEDBACK
  // =====================
  function zeigeNachricht(text, typ) {
    const el = document.getElementById('feedback');
    el.classList.remove('show');
    setTimeout(() => {
      el.textContent = text;
      el.className = 'feedback-text ' + typ;
      if (text) el.classList.add('show');
    }, 50);
  }

  // =====================
  //  TIMER
  // =====================
  function starteTimer() {
    stoppeTimer();
    let sekunden = timerSekunden;
    const bar = document.getElementById('timer-bar');
    const anzeige = document.getElementById('stat-timer');

    bar.style.width = '100%';
    bar.className = 'timer-bar';
    anzeige.textContent = sekunden;
    anzeige.className = 'stat-value';

    timerInterval = setInterval(() => {
      sekunden--;
      anzeige.textContent = sekunden;
      const prozent = (sekunden / timerSekunden) * 100;
      bar.style.width = prozent + '%';

      if (prozent <= 30) {
        bar.className = 'timer-bar danger';
        anzeige.className = 'stat-value danger';
      } else if (prozent <= 60) {
        bar.className = 'timer-bar warning';
        anzeige.className = 'stat-value';
      }

      if (sekunden <= 0) {
        stoppeTimer();
        if (!spielVorbei) verloren();
      }
    }, 1000);
  }

  function stoppeTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // =====================
  //  START
  // =====================
  neuesSpiel();
</script>
</body>
</html>
